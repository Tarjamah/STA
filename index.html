<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STA — Sight Translation Assessment</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text:      #1a1a1a;
      --muted:     #5a5a5a;
      --border:    #d0c9bc;
      --bg-alt:    #f8f7f4;
      --accent:    #2a4a7f;
      --accent-lt: #e8edf6;
      --accent-dk: #1d3460;
      --max-w:     820px;
    }

    html { font-size: 17px; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: #fff;
      line-height: 1.7;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      background: #fff;
      border-bottom: 1px solid var(--border);
      z-index: 100;
      padding: 0 1.5rem;
    }

    .nav-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
    }

    .nav-logo {
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      text-decoration: none;
    }

    .nav-logo span {
      font-weight: 400;
      color: var(--muted);
      margin-left: 0.4em;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.85rem;
    }

    .nav-tabs {
      display: flex;
      height: 100%;
    }

    .nav-tabs a {
      display: flex;
      align-items: center;
      padding: 0 1.1rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }

    .nav-tabs a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .hero {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 4.5rem 1.5rem 4rem;
      text-align: center;
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 560px;
      margin: 0 auto 2.4rem;
      line-height: 1.7;
    }

    .download-group {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.72rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      border: 1.5px solid var(--accent);
      background: #fff;
      color: var(--accent);
      transition: all .15s ease;
    }

    .btn:hover {
      background: var(--accent-lt);
    }

    .btn svg {
      flex-shrink: 0;
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="main.html">
      STA <span>Sight Translation Assessment</span>
    </a>

    <div class="nav-tabs">
      <a href="main.html" class="active">About</a>
      <a href="docs.html">Documentation</a>
    </div>
  </div>
</nav>

<section class="hero">
  <p>
    STA is a desktop application that combines Praat acoustic analysis,
    OpenAI Whisper speech recognition, and GPT-based quality scoring
    to provide evaluation of sight translation sessions.
  </p>

  <div class="download-group">
    <a class="btn" href="#" download>

      </svg>
      Download for macOS
    </a>
  </div>
</section>

</body>
</html>
